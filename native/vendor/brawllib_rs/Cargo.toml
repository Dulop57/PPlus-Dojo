[package]
name = "brawllib_rs"
edition = "2024"
version = "0.29.0"
authors = ["Rukai <rubickent@gmail.com>"]
description = "Brawl character parser; P+ Dojo patch makes the unused renderer optional"
license = "MIT"
repository = "https://github.com/rukai/brawllib_rs"

[features]
default = []
renderer = ["dep:gif", "dep:wgpu", "dep:winit", "dep:winit_input_helper", "dep:raw-window-handle", "dep:futures", "dep:bytemuck", "dep:console_log", "dep:console_error_panic_hook", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:web-time"]

[dependencies]
bitflags = { version = "2", features = ["serde"] }
byteorder = "1"
cgmath = { version = "0.18", features = ["mint", "serde"] }
log = "0.4"
serde = "1"
serde_derive = "1"
rayon = "1"
anyhow = "1"
env_logger = "0.11"
fancy_slice = "0.1"
gif = { version = "0.13", optional = true }
wgpu = { version = "27", features = ["webgl"], optional = true }
winit = { version = "0.30", features = ["rwh_06"], optional = true }
winit_input_helper = { version = "0.17.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }
futures = { version = "0.3", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
console_log = { version = "1.0", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true }
web-time = { version = "1.0", optional = true }
