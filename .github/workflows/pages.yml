name: Publish GitHub Pages
on:
  workflow_dispatch:
    inputs:
      dataset_url:
        description: 'Public HTTPS dataset ZIP (manifest.json at root). Leave blank for setup preview.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Import verified dataset
        if: inputs.dataset_url != ''
        env:
          DATASET_URL: ${{ inputs.dataset_url }}
        run: node scripts/fetch-dataset.mjs
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
